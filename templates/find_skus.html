<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>find skus</title>
    <style>
      body {
        background-color: gray;
      }
    </style>
    <script src="static/src/htmx.min.js"></script>
  </head>
  <body>
    <input
      name="merchants_name"
      id="merchant-selector"
      hx-swap="innerHTML"
      hx-trigger="input changed delay:500ms, keyup[key=='Enter'], load"
      hx-get="{% url 'merchant-search-for-skus' %}"
      hx-params="merchants_name"
      hx-target="#merchantSelector"
    >
      merchant
    </input>
    <div id=merchantSelector></div>
  </body>
</html>
